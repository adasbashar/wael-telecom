plugins { id 'com.android.application' }

android {
    namespace 'com.waeltelecom.app'
    compileSdk 34
    defaultConfig {
        applicationId "com.waeltelecom.app"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }
    signingConfigs {
        release {
            storeFile file("wael-telecom.keystore")
            storePassword "waeltelecom2026"
            keyAlias "waeltelecom"
            keyPassword "waeltelecom2026"
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
