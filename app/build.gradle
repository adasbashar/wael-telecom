plugins { id 'com.android.application' }

android {
    namespace 'com.waeltelecom.app'
    compileSdk 34
    defaultConfig {
        minSdk 24
        targetSdk 34
        versionCode 4
        versionName "1.3"
    }
    flavorDimensions "store"
    productFlavors {
        wael {
            dimension "store"
            applicationId "com.waeltelecom.app"
            resValue "string", "app_name", "Wael Telecom"
        }
        sham {
            dimension "store"
            applicationId "com.shamtelecom.app"
            resValue "string", "app_name", "شام للاتصالات"
        }
    }
    signingConfigs {
        release {
            storeFile file("wael-telecom.keystore")
            storePassword "waeltelecom2026"
            keyAlias "waeltelecom"
            keyPassword "waeltelecom2026"
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
